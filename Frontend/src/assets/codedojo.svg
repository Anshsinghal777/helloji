<svg 
  viewBox="0 0 650 320" 
  xmlns="http://www.w3.org/2000/svg"
  class="w-full h-full"
  style="filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.8)); min-width: 96px;"
>
  <defs>
    <!-- Cyberpunk gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="40%" stop-color="#7A5CFF"/>
      <stop offset="75%" stop-color="#FF00E0"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <!-- Strong glow for big size -->
    <filter id="logo-glow">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle inner shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Geometric infinity (angular, aggressive style) - EXTRA THICK STROKE -->
  <path 
    d="
      M150 160 
      L220 90 
      L310 90 
      L360 160 
      L310 230 
      L220 230 
      Z

      M360 160
      L410 90
      L500 90
      L570 160
      L500 230
      L410 230
      Z"
    fill="none"
    stroke="url(#neon)"
    stroke-width="18"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#logo-glow)"
  />

  <!-- Inner shine stroke -->
  <path 
    d="
      M150 160 
      L220 90 
      L310 90 
      L360 160 
      L310 230 
      L220 230 
      Z

      M360 160
      L410 90
      L500 90
      L570 160
      L500 230
      L410 230
      Z"
    fill="none"
    stroke="url(#shine)"
    stroke-width="4"
    opacity="0.9"
  />

  <!-- Circuit-like accent lines for bigger logo -->
  <g stroke="#00F5FF" stroke-width="4" opacity="0.8">
    <line x1="100" y1="160" x2="150" y2="160"/>
    <circle cx="100" cy="160" r="7" fill="#00F5FF"/>

    <line x1="570" y1="160" x2="620" y2="160"/>
    <circle cx="620" cy="160" r="7" fill="#00F5FF"/>
  </g>

  <!-- Additional glow effects -->
  <ellipse cx="360" cy="160" rx="250" ry="80" fill="url(#neon)" opacity="0.05" filter="blur(40px)"/>
</svg>